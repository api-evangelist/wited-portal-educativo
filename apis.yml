aid: wited-portal-educativo
name: Wited (Portal Educativo)
description: Wited (formerly Portal Educativo) is a Chilean edtech company backed by
  500 Global that delivers online academic support and homeschooling across Latin
  America. Its two products - Reforzamiento (tutoring, homework help, and exam prep
  for K-12 students in traditional schools) and Colegio Online (a complete online
  school for homeschoolers) - combine curriculum-aligned courses, interactive exercises,
  the Max AI tutoring chatbot, live teacher support (Profes Express), and a parent
  progress dashboard. Wited operates in Chile, Mexico, Colombia, Panama, Argentina,
  Brazil, Spain, and the United States. The consumer platform runs at app.wited.com
  against a private backend (api.wited.com); the company publishes no public developer
  program or API.
